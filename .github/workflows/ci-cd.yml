name: APIShield Pro — CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/apishield

jobs:
  # ── Lint & Test ──────────────────────────────────────────────────────────────
  test-gateway:
    name: Test Gateway Service
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --eval \"db.adminCommand('ping')\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.2-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: gateway-service/package-lock.json

      - name: Install dependencies
        working-directory: gateway-service
        run: npm ci

      - name: Run tests
        working-directory: gateway-service
        run: npm test
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/apishield_test
          REDIS_URL: redis://localhost:6379
          ADMIN_SECRET_KEY: test_secret_key

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gateway-coverage
          path: gateway-service/coverage/

  test-analytics:
    name: Test Analytics Service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: analytics-service/package-lock.json

      - name: Install dependencies
        working-directory: analytics-service
        run: npm ci

  # ── Build Docker Images ──────────────────────────────────────────────────────
  build-images:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [test-gateway, test-analytics]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "timestamp=$(date -u +%Y%m%d%H%M%S)" >> $GITHUB_OUTPUT

      # Gateway
      - name: Build & push gateway image
        uses: docker/build-push-action@v5
        with:
          context: ./gateway-service
          target: production
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-gateway:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-gateway:${{ steps.meta.outputs.sha_short }}
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway

      # Analytics
      - name: Build & push analytics image
        uses: docker/build-push-action@v5
        with:
          context: ./analytics-service
          target: production
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-analytics:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-analytics:${{ steps.meta.outputs.sha_short }}
          cache-from: type=gha,scope=analytics
          cache-to: type=gha,mode=max,scope=analytics

      # Frontend
      - name: Build & push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-dashboard
          target: production
          push: true
          build-args: |
            VITE_GATEWAY_URL=${{ vars.VITE_GATEWAY_URL || 'http://localhost:3000' }}
            VITE_ANALYTICS_URL=${{ vars.VITE_ANALYTICS_URL || 'http://localhost:3001' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:${{ steps.meta.outputs.sha_short }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ── Deploy (simulated) ───────────────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-images
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        # Replace with your actual deploy step (SSH, kubectl, etc.)
        run: |
          echo "🚀 Deploying APIShield Pro to production..."
          echo "Images tagged with: $(git rev-parse --short HEAD)"
          echo "Deploy command would run here:"
          echo "  ssh deploy@your-server 'cd /opt/apishield && docker compose pull && docker compose up -d'"
          echo "✅ Deployment simulated successfully"

      - name: Notify on success
        run: |
          echo "✅ Deployment complete!"
          echo "Gateway:   ${{ vars.VITE_GATEWAY_URL || 'http://localhost:3000' }}"
          echo "Analytics: ${{ vars.VITE_ANALYTICS_URL || 'http://localhost:3001' }}"
          echo "Dashboard: http://localhost:80"

services:
  # ── Gateway Service ────────────────────────────────────────────────────────
  gateway:
    build:
      context: ./gateway-service
      target: production
    container_name: apishield-gateway
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000

      # External Cloud Services
      MONGODB_URI: ${MONGODB_URI}
      REDIS_URL: ${REDIS_URL}

      # Gateway Config
      EVENT_QUEUE_KEY: event_queue
      FRONTEND_URL: http://localhost

      # Security
      ADMIN_SECRET_KEY: ${ADMIN_SECRET_KEY}
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      TEST_API_KEY: ${TEST_API_KEY}

      # Rate Limiting
      DEFAULT_RATE_LIMIT: ${DEFAULT_RATE_LIMIT:-100}
      DEFAULT_WINDOW_SECONDS: ${DEFAULT_WINDOW_SECONDS:-60}

      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-info}

    ports:
      - "3000:3000"

    networks:
      - apishield-net

  # ── Analytics Service ──────────────────────────────────────────────────────
  analytics:
    build:
      context: ./analytics-service
      target: production
    container_name: apishield-analytics
    restart: unless-stopped
    depends_on:
      - gateway

    environment:
      NODE_ENV: production
      PORT: 3001

      # External Cloud Services
      MONGODB_URI: ${MONGODB_URI}
      REDIS_URL: ${REDIS_URL}

      # Analytics Config
      EVENT_QUEUE_KEY: event_queue
      FRONTEND_URL: http://localhost

      BATCH_SIZE: 50
      POLL_INTERVAL_MS: 500
      SNAPSHOT_INTERVAL_MS: 10000

      LOG_LEVEL: ${LOG_LEVEL:-info}

    ports:
      - "3001:3001"

    networks:
      - apishield-net

  # ── Frontend Dashboard ─────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend-dashboard
      target: production
      args:
        VITE_GATEWAY_URL: http://localhost:3000
        VITE_ANALYTICS_URL: http://localhost:3001
        VITE_ADMIN_KEY: ${ADMIN_SECRET_KEY}

    container_name: apishield-frontend
    restart: unless-stopped

    depends_on:
      - gateway
      - analytics

    ports:
      - "80:80"

    networks:
      - apishield-net

networks:
  apishield-net:
    driver: bridge